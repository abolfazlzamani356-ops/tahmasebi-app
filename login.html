{% extends 'base.html' %}

{% block title %}ورود به سامانه هوشمند طهماسبی{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white p-8 rounded-3xl shadow-xl border border-slate-200">
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-50 border border-indigo-100 rounded-3xl mb-4 text-3xl shadow-inner">
            🏬
        </div>
        <h2 class="text-2xl font-black text-slate-900">فروشگاه‌های تخصصی طهماسبی</h2>
        <p class="text-slate-500 text-xs mt-1.5 font-medium">ورود ایمن به سامانه جامع فروش، انبارداری و حسابداری</p>
    </div>

    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-slate-700 text-xs mb-1.5 font-bold">نام کاربری:</label>
            <input type="text" name="username" required autofocus placeholder="مثال: admin یا نام کاربری فروشنده" class="w-full p-3 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none text-left font-bold text-slate-800 transition" dir="ltr">
        </div>

        <div>
            <label class="block text-slate-700 text-xs mb-1.5 font-bold">رمز عبور:</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full p-3 border border-slate-300 rounded-2xl focus:ring-2 focus:ring-indigo-600 focus:border-indigo-600 outline-none text-left font-bold text-slate-800 transition" dir="ltr">
        </div>

        <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-2 mt-6">
            <span>ورود به حساب کاربری</span>
            <span>←</span>
        </button>
    </form>
</div>
{% endblock %}
